services:
  db:
    image: postgres:16-alpine
    container_name: rydeher-cup-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rydeher
      POSTGRES_PASSWORD: rydeher
      POSTGRES_DB: rydeher
    volumes:
      - rydeher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rydeher -d rydeher"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  rydeher_pgdata:
